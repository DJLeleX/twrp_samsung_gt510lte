name: Build TWRP for gt510lte

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 100
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_temp

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc cpio rsync
          
          # Install Java 8 (Required for Android 8.1 / TWRP 8.1)
          sudo apt-get install -y openjdk-8-jdk
          
          # Install Legacy Python 2 and libncurses5
          sudo apt-get install -y python2 libncurses5
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Fix libssl1.1 requirement for host tools
          wget http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb

          sudo curl --create-dirs -L -o /usr/local/bin/repo -O -L https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP Source (8.1)
        run: |
          mkdir twrp
          cd twrp
          # Changed branch to twrp-8.1
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-8.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build TWRP
        run: |
          mkdir -p twrp/device/samsung/gt510lte
          cp -r device_temp/* twrp/device/samsung/gt510lte/
          rm -rf device_temp
          
          cd twrp
          # Ensure Java 8 is the default for this shell
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_gt510lte-eng
          make -j$(nproc --all) recoveryimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-gt510lte-Build
          path: |
            twrp/out/target/product/gt510lte/recovery.img
            twrp/out/target/product/gt510lte/*.tar